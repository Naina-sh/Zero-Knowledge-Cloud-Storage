name: Keep Render Alive

# Pings the Zero-Knowledge Cloud Vault Render backend's public health endpoint
# so the Render free-tier service is not spun down after 15 min of inactivity.
# This is a lightweight, read-only GET that requires no authentication and
# modifies no application data.

on:
  schedule:
    # Every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsS --max-time 30 \
            https://zero-cloud-api.onrender.com/api/health
